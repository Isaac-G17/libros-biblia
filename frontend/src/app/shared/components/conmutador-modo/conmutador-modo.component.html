<div class="grupo" role="group" aria-label="Modo de uso">
  @for (opcion of opciones; track opcion.valor) {
    <button type="button" [attr.aria-pressed]="modo() === opcion.valor" (click)="cambio.emit(opcion.valor)">
      @if (modo() === opcion.valor) {
        <span aria-hidden="true">✓</span>
      }
      {{ opcion.etiqueta }}
    </button>
  }
</div>
